name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests scripts ../eval && ruff format --check app tests scripts ../eval
      - name: Unit, contract and API tests (Jev mocked; no secrets needed)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t promptlint:ci .

  # Re-runs the evals against the real Jev API when questions, weights, tips or prices change.
  eval-regression:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did backend/config change?
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$base" HEAD -- backend/config | grep -q .; then echo "run=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
      - if: steps.changed.outputs.run == 'true'
        run: pip install -e "backend"
      - name: Pairwise + checklist evals and regression floors
        if: steps.changed.outputs.run == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then echo "::warning::TYPESAFE_API_KEY secret not set; skipping eval regression"; exit 0; fi
          python eval/run_pairwise.py
          python eval/run_checklist.py
          python eval/check_regression.py
