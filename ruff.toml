extend-exclude = ["eval/report.ipynb"]
# Shared by backend/ and eval/.
line-length = 110
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter owns line length

[lint.isort]
known-first-party = ["app", "common"]

[lint.flake8-bugbear]
# FastAPI dependency injection is declared in argument defaults by design.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
